# Bump `version` in Cargo.toml, then push a matching tag like v0.1.0 to publish Masthead.app (Apple Silicon, ad-hoc signed) as a GitHub release:
# a .dmg to install by hand and a .zip for the in-app updater.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # The app compares its own version (from Cargo.toml) with the latest tag to offer updates.
      - name: Tag matches Cargo.toml version
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release  # restores the cache CI saves from main
          save-if: false
      - run: brew install librsvg
      - run: scripts/bundle.sh
      - run: ditto -c -k --keepParent dist/Masthead.app Masthead-macos-arm64.zip
      - name: Disk image (app + Applications shortcut to drag it onto)
        run: |
          mkdir dmg && ditto dist/Masthead.app dmg/Masthead.app && ln -s /Applications dmg/Applications
          hdiutil create -volname Masthead -srcfolder dmg -ov -format UDZO Masthead-macos-arm64.dmg
      - run: gh release create "$GITHUB_REF_NAME" Masthead-macos-arm64.dmg Masthead-macos-arm64.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
